{% extends "base.html" %}
{% load static %}
{% load jalali_tags %}


{% block title %}تایید کد{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-box">
    <h2>تایید کد پیامکی</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.code.label_tag }}
      {{ form.code }}
      {% if form.code.errors %}
      <small style="color:red">{{ form.code.errors.0 }}</small>
      {% endif %}
      <button type="submit" class="btn-auth-submit">ادامه</button>
    </form>
  </div>
</section>
{% endblock %}
